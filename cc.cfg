# Card Cascade configuration - one set per line:
#   <game>,<set name>[,box=V][,split=V][,split1=V,split2=V]
# where V is <unsleeved>[/<sleeved>][@<box name>:<base model>]:
#   widths are the side-label widths per sleeving (one value = both);
#   a width of 0 means that sleeving has no side label (front only).
#   The optional @<box name>:<base model> identifies the recommended box;
#   plate titles show the full model: <base model>.<width>-Un/-Sl.
#   box=    the whole set's box; presence means whole-box labels
#   split=  both split half-boxes; split1=/split2= when the halves differ
#           (must be given together); presence means "<name> 1/2" labels
#   parts=<w1>+...@<l1>|<l2>|...[#<tag>]  one part per label; emits one
#           plate per width, each holding all parts at that width. Front-width
#           labels read "<name> <label>", narrower ones just "<label>" (e.g.
#           parts=156.4+45+62@Ages 1-4|Ages 5-8|Ages 9+); repeatable. Each
#           grouping becomes its own 3MF, named "<n> Cascades" or, with a
#           trailing #<tag>, "<tag> <n> Cascades" — needed when two groupings
#           split the set into the same NUMBER of cascades. A label may hold a
#           comma; only a comma that starts another key= splits a field.
#   names=<w1>+...@<n1>[:<short>]|<n2>[:<short>]|...  the transpose of
#           parts=: one plate PER NAME, each holding all the widths. For a
#           box design that ships once per expansion, so one plate is one
#           box's labels. The NARROWEST width takes the short form if one
#           is given; every other width takes the full name. "(BLANK)" is
#           the blank label
#   side=<text>  short text for side labels (fronts keep the set name),
#           e.g. side=FCM/O prints FCM/O and FCM/O 1 on side labels
#   plate=<title>:<w1>+<w2>+...  an extra plate with exactly these label
#           widths (free-form, not limited to the standard widths);
#           may be given multiple times
#   logo=<file>  artwork in logos/<game>/<file> (DXF) printed instead of
#           the set name; every plate= plate is emitted "with logo" and
#           "plain"
#   numbers=<n>  the set ships as n numbered boxes: every plate= plate is
#           repeated unnumbered and once per number. Plain labels read
#           "<name> <i>" at every width; logo labels carry the number on
#           the front label only
# Widths must be standard widths for the game (see GAMES in the script).
# A line with no keys is skipped.
# The special name "(BLANK)" is the blank label (logo + cc, no text).
