# "Compile" line below covers every Compile box - so they are kept here as
# a record of the recommended boxes only:
#   Compile 18  box=20/45@126 Card:S5.7.7
#   Compile 15  box=20/32@105 Card:S4.7.7
#   Compile 30  box=20/45@210 Card:L5.7.7
