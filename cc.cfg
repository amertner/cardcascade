# Innovation Ultimate is 11 ages plus a slot of special cards = 12 columns,
# which is 3 M boxes of 4 or 4 S boxes of 3. The two ORIGINAL groupings build
# it out of the 15-card box alone and put the specials in the last slot.
#
# The "Later Ages" groupings are the current recommendation: one 15-card box
# first, because only its deeper pockets take the age 1 cards and the specials,
# then 2 (M) or 3 (S) of the 10-card Later Ages boxes. The specials move to the
# FRONT, ahead of age 1, which is what "Ages Sp,1-3" says. Side widths differ
# by box within one grouping — 45/62 for the 15-card box, 32/45 for the 10-card
# ones — so all four widths are listed and each plate carries every part at
# that width; print box 1's side off the 45 (or 62) plate and the rest off the
# 32 (or 45) one.
Innovation,Innovation,plate=Innovation:156.4+45+62,parts=156.4+45+62@Ages 1-4|Ages 5-8|Ages 9+,parts=156.4+45+62@Ages 1-3|Ages 4-6|Ages 7-9|Ages 10+,parts=156.4+62+45+32@Ages Sp,1-3|Ages 4-7|Ages 8-11#Later Ages,parts=156.4+62+45+32@Ages Sp,1-2|Ages 3-5|Ages 6-8|Ages 9-11#Later Ages
# The Single Set line covers TWO boxes, so its widths are not one front
# plus that front's sides. By box and sleeving:
#   S3.15.10   front 156.4;  side 32 sleeved, 20 unsleeved
#   XS5.15.10  front 62;     side 45 sleeved, 32 unsleeved
# The XS box is only 150.9 mm wide, too narrow for the 156.4 front label,
# so the 62 is a FRONT there (its pocket is cut for it at 62.4 mm outer);
# the 32 does double duty as the S box's sleeved side and the XS box's
# unsleeved side. Widths are listed widest first, and the narrowest (20)
# is the only one that takes a name's short form.
Innovation,Single Set,names=156.4+62+45+32+20@Innovation:Inno|Echoes|Cities|Artifacts:Artif|Figures|Unseen|(BLANK)
